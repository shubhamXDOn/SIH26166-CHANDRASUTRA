services:
  - type: web
    name: chandrasutra-backend
    runtime: docker
    plan: free
    branch: main
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_VERSION
        value: "0.11.0"
      - key: BACKEND_HOST
        value: "0.0.0.0"
      - key: BACKEND_PORT
        value: "8000"
      - key: DATA_ROOT
        value: "/data"
      - key: DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Cross-origin deployment (Netlify UI -> Render API): the HttpOnly refresh
      # cookie is third-party, so it must be Secure + SameSite=None to survive.
      # Secure is already forced on in production; stated explicitly for clarity.
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: AUTH_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: AUTH_REGISTER_ENABLED
        value: "true"
      # Must be the exact deployed frontend origin, e.g. https://<site>.netlify.app
      # ("*" is rejected by the production config validator). Left as a prompt.
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
