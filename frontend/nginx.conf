# M11 hardened reverse proxy for the CHANDRASUTRA SPA + API.
# - Bounded request bodies (mirrors the backend's 413 LIMIT_EXCEEDED policy).
# - Generous proxy timeouts so long, honest pipeline runs are never cut.
# - X-Request-ID passthrough so client-side correlation reaches the backend.
# - Baseline security headers for the static SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reject oversized uploads at the proxy before the backend ever sees them.
    client_max_body_size 8m;
    client_body_timeout 15s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward client request ids; nginx >= 1.11 exposes $request_id.
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Request-ID $request_id always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}